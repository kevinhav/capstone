[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kevinhav", email = "kevin.havis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "ipykernel>=7.3.0",
    "joblib>=1.6.0",
    "jupyter>=1.1.1",
    "loguru>=0.7.3",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
    "streamlit>=1.65.0",
]

[project.scripts]
capstone = "capstone:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
